version: '3.8'

services:
  n8n-dev:
    build:
      context: .
      dockerfile: docker/images/n8n-oidc/Dockerfile
    container_name: n8n-dev
    ports:
      - "5678:5678"
    environment:
      # Basic n8n configuration
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      
      # OIDC Configuration
      - N8N_SSO_OIDC_ENABLED=true
      - N8N_OIDC_ISSUER_URL=${N8N_OIDC_ISSUER_URL}
      - N8N_OIDC_CLIENT_ID=${N8N_OIDC_CLIENT_ID}
      - N8N_OIDC_CLIENT_SECRET=${N8N_OIDC_CLIENT_SECRET}
      - N8N_OIDC_REDIRECT_URL=http://localhost:5678/rest/sso/oidc/callback
      - N8N_OIDC_SCOPES=openid email profile
      - N8N_OIDC_JIT_PROVISIONING=true
      - N8N_OIDC_REDIRECT_LOGIN_TO_SSO=false
      
      # Database (using SQLite for development)
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
      
      # Logging
      - N8N_LOG_LEVEL=debug
      
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    
    # Optional: Add a database service
  # postgres:
  #   image: postgres:15
  #   container_name: n8n-postgres
  #   environment:
  #     - POSTGRES_DB=n8n
  #     - POSTGRES_USER=n8n
  #     - POSTGRES_PASSWORD=n8n
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  n8n_data:
  # postgres_data:
